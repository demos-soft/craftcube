{% include "includes/layout.html" %}
{% if not request.args.get('_framed') %}{% include "includes/menu.html" %}{% endif %}

    <div id="layout-content" class="selected">
      <div class="header">
        <a class="button icon back-list-button" href="{{ url_for('views.contacts') }}#back"><span class="inner">{{ 'Back'|lc }}</span></a>
        <span class="header-title">{{ row.name or row.email }}</span>
        <div class="toolbar menu" role="toolbar">
          <a class="btn btn-link compose" href="{{ url_for('views.compose', _to=row.email) }}" title="{{ 'Compose'|lc }}"><span class="inner">{{ 'Compose'|lc }}</span></a>
          <form method="post" action="{{ url_for('views.contact_delete', cid=row.contact_id) }}" class="d-inline"
                onsubmit="return confirm('{{ _('deletecontactconfirm') }}')">
            <button type="submit" class="btn btn-link delete" title="{{ 'Delete'|lc }}"><span class="inner">{{ 'Delete'|lc }}</span></button>
          </form>
        </div>
      </div>
      <div class="content frame-content" role="main">
        {% include "includes/contactshow.html" %}
      </div>
    </div>

{% include "includes/footer.html" %}
