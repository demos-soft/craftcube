{% include "includes/layout.html" %}
{% include "includes/menu.html" %}

    <h1 class="voice">{{ 'Edit contact' if row else 'New contact' }}</h1>

    <div id="layout-content" class="selected">
      <div class="header">
        <a class="button icon back-content-button" href="{{ url_for('views.contact_view', cid=row.contact_id) if row else url_for('views.contacts') }}"><span class="inner">Cancel</span></a>
        <span class="header-title">{{ 'Edit' if row else 'Create' }} contact</span>
      </div>
      <div class="formcontainer content">
        <form method="post" class="formcontent">
          <fieldset>
            <legend>Contact</legend>
            <table class="layout propform">
              <tbody>
                <tr>
                  <td class="title"><label for="inputname">Display name</label></td>
                  <td class="field"><input type="text" name="name" id="inputname" value="{{ row['name'] if row else '' }}" class="form-control"></td>
                </tr>
                <tr>
                  <td class="title"><label for="inputfirstname">First name</label></td>
                  <td class="field"><input type="text" name="firstname" id="inputfirstname" value="{{ row.firstname if row else '' }}" class="form-control"></td>
                </tr>
                <tr>
                  <td class="title"><label for="inputsurname">Surname</label></td>
                  <td class="field"><input type="text" name="surname" id="inputsurname" value="{{ row.surname if row else '' }}" class="form-control"></td>
                </tr>
                <tr>
                  <td class="title"><label for="inputemail">Email</label></td>
                  <td class="field"><input type="text" name="email" id="inputemail" value="{{ row.email if row else '' }}" class="form-control" placeholder="a@b.c, d@e.f"></td>
                </tr>
              </tbody>
            </table>
          </fieldset>
          <div class="formbuttons">
            <button type="submit" class="btn btn-primary icon save">Save</button>
            <a class="btn btn-secondary icon cancel" href="{{ url_for('views.contact_view', cid=row.contact_id) if row else url_for('views.contacts') }}">Cancel</a>
          </div>
        </form>
      </div>
    </div>

{% include "includes/footer.html" %}
