<!DOCTYPE html>
<html lang="{{ (lang or 'en_US')[:2] }}"{{ ' class="iframe"'|safe if framed_page|default(false) }}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ product_name }} :: {{ page_title or _('welcome', product=product_name) }}{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='images/unicorn.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='deps/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='craftcube.css') }}">
  {%- for css in plugin_stylesheets %}<link rel="stylesheet" href="{{ css }}">{% endfor -%}
  {% if dark_mode_support|default(true) %}
  <script>
  try {
    if (document.cookie.indexOf('colorMode=dark') > -1
      || (document.cookie.indexOf('colorMode=light') === -1 && window.matchMedia('(prefers-color-scheme: dark)').matches)
    ) {
      document.documentElement.className += ' dark-mode';
    }
  } catch (e) { }
  </script>
  {% endif %}
</head>
<body class="task-{{ task or 'error' }} action-{{ action or 'none' }}"
      data-display-next="{{ 1 if (g.prefs or {}).get('display_next') else 0 }}"
      data-refresh-interval="{{ (g.prefs or {}).get('refresh_interval', 0) or 0 }}"
      data-autoexpand-threads="{{ (g.prefs or {}).get('autoexpand_threads', '0') or '0' }}"
      data-mail-read-time="{{ (g.prefs or {}).get('mail_read_time', '0') or '0' }}"
      data-standard-windows="{{ 1 if (g.prefs or {}).get('standard_windows') else 0 }}"
      data-message-extwin="{{ 1 if (g.prefs or {}).get('message_extwin') else 0 }}"
      data-compose-extwin="{{ 1 if (g.prefs or {}).get('compose_extwin') else 0 }}">
  <div id="layout">
