<div id="layout-menu">
  <h2 id="aria-label-tasknav" class="voice">Application tasks</h2>
  <div class="popover-header">
    <img src="{{ url_for('static', filename='images/logo.svg') }}" id="logo" alt="Logo">
    <a class="button icon cancel"><span class="inner">Close</span></a>
  </div>
  <div id="taskmenu" class="menu toolbar" role="navigation" aria-labelledby="aria-label-tasknav">
      <span class="action-buttons">
        {% if task == 'mail' and action == 'compose' %}
          <a class="compose selected" title="Create a new message" href="{{ url_for('views.compose') }}"><span class="inner">Compose</span></a>
        {% else %}
          <a class="compose" title="Create a new message" href="{{ url_for('views.compose') }}" data-fab="true" data-fab-task="mail" data-fab-action="none"><span class="inner">Compose</span></a>
        {% endif %}
      </span>
      {% if action == 'compose' and task == 'mail' %}
        <a class="mail" href="{{ url_for('views.mail') }}"><span class="inner">Mail</span></a>
      {% else %}
        <a class="mail{{ ' selected' if task == 'mail' }}" href="{{ url_for('views.mail') }}"><span class="inner">Mail</span></a>
      {% endif %}
      <a class="contacts{{ ' selected' if task == 'addressbook' }}" href="{{ url_for('views.contacts') }}"><span class="inner">Contacts</span></a>
      <a class="settings{{ ' selected' if task == 'settings' }}" href="{{ url_for('views.settings') }}"><span class="inner">Settings</span></a>
      <span class="special-buttons">
        <a class="theme dark" href="#" id="darktoggle"><span class="inner">Dark mode</span></a>
        <a class="about" href="{{ url_for('views.about') }}" onclick="return window.cc_about_dialog ? window.cc_about_dialog(this) : true"><span class="inner">About</span></a>
        <a class="logout" href="{{ url_for('views.logout') }}"><span class="inner">Logout</span></a>
      </span>
  </div>
</div>
