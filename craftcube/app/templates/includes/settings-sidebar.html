{# Settings navigation sidebar — skins/elastic/templates/includes/settings-menu.html #}
<div id="layout-sidebar" class="listbox" role="navigation" aria-labelledby="aria-label-settingstabs">
  <div class="header">
    <a class="button icon task-menu-button" href="#menu"><span class="inner">Menu</span></a>
    <span id="aria-label-settingstabs" class="header-title">Settings</span>
  </div>
  <div class="scroller">
    <ul id="settings-menu" class="listing iconized settings-default-icon">
      <li class="listitem preferences{{ ' selected' if settings_nav == 'preferences' }}"><a title="Edit user preferences" href="{{ url_for('views.settings_preferences') }}">Preferences</a></li>
      <li class="listitem folders{{ ' selected' if settings_nav == 'folders' }}"><a title="Manage folders" href="{{ url_for('views.folders_view') }}">Folders</a></li>
      <li class="listitem identities{{ ' selected' if settings_nav == 'identities' }}"><a title="Manage identities" href="{{ url_for('views.identities') }}">Identities</a></li>
      <li class="listitem responses{{ ' selected' if settings_nav == 'responses' }}"><a title="Manage responses" href="{{ url_for('views.responses') }}">Responses</a></li>
    </ul>
  </div>
</div>
