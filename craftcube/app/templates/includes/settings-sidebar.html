{# Settings navigation sidebar (Elastic: Preferences / Identities / Folders / Responses) #}
<div id="layout-sidebar" class="listbox" role="navigation">
  <div class="header">
    <a class="button icon back-list-button" href="#back"><span class="inner">Back</span></a>
    <span class="header-title">Settings</span>
  </div>
  <div class="scroller">
    <ul class="listing settings-table treelist iconized">
      <li class="preferences{{ ' selected' if settings_nav == 'preferences' }}"><a href="{{ url_for('views.settings_preferences') }}"><span class="inner">Preferences</span></a></li>
      <li class="folders{{ ' selected' if settings_nav == 'folders' }}"><a href="{{ url_for('views.folders_view') }}"><span class="inner">Folders</span></a></li>
      <li class="identities{{ ' selected' if settings_nav == 'identities' }}"><a href="{{ url_for('views.identities') }}"><span class="inner">Identities</span></a></li>
      <li class="responses{{ ' selected' if settings_nav == 'responses' }}"><a href="{{ url_for('views.responses') }}"><span class="inner">Responses</span></a></li>
    </ul>
  </div>
</div>
