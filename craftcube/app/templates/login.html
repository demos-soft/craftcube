{% include "includes/layout.html" %}

    <h1 class="voice">{{ product_name }} {{ _('login') }}</h1>

    <div id="layout-content" class="selected no-navbar" role="main">
      <img src="{{ url_for('static', filename='images/logo.svg') }}" id="logo" alt="Logo">
      <form id="login-form" name="login-form" method="post" class="propform">
        <table>
          <tbody>
            <tr class="form-group row">
              <td class="title" style="display: none;"><label for="rcmloginuser">{{ _('username') }}</label></td>
              <td class="input input-group input-group-lg">
                <span class="input-group-prepend"><i class="input-group-text icon user"></i></span>
                <input name="_user" id="rcmloginuser" required size="40" placeholder="{{ _('username') }}" autofocus
                   class="form-control" autocapitalize="off" autocomplete="username" value="" type="text">
              </td>
            </tr>
            <tr class="form-group row">
              <td class="title" style="display: none;"><label for="rcmloginpwd">{{ _('password') }}</label></td>
              <td class="input input-group input-group-lg">
                <span class="input-group-prepend"><i class="input-group-text icon pass"></i></span>
                <input name="_pass" id="rcmloginpwd" required size="40" placeholder="{{ _('password') }}"
                   class="form-control" autocapitalize="off" autocomplete="off" type="password">
              </td>
            </tr>
          </tbody>
        </table>
        {% if error %}
        <div class="text-danger mb-2">{{ error }}</div>
        {% endif %}
        <p class="formbuttons">
          <button type="submit" id="rcmloginsubmit"
                  class="button mainaction submit btn btn-primary btn-lg text-uppercase w-100"
                  tabindex="3">{{ _('login') }}</button>
        </p>
        <input type="hidden" name="_timezone" id="rcmlogintz" value="_default_">
        <script>
          // Roundcube-style client timezone detection sent with the login POST
          try {
            var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            if (tz) document.getElementById('rcmlogintz').value = tz;
          } catch (e) { }
        </script>
        <div id="login-footer" role="contentinfo">
          {{ product_name }}
          &nbsp;&bull;&nbsp; {{ version }}
        </div>
      </form>
    </div>

    <noscript>
      <p class="noscriptwarning">{{ _('noscriptwarning') }}</p>
    </noscript>

{% include "includes/footer.html" %}
