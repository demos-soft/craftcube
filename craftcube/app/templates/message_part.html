<!DOCTYPE html>
<html lang="en" class="iframe">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="{{ url_for('static', filename='deps/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='craftcube.css') }}">
  <script>
  try {
    if (document.cookie.indexOf('colorMode=dark') > -1
      || (document.cookie.indexOf('colorMode=light') === -1 && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.className += ' dark-mode';
    }
  } catch (e) { }
  </script>
</head>
<body class="task-mail action-show">
  <h1 class="voice">Message preview</h1>
  <div id="layout">
    <div id="layout-content" class="selected">
      <div class="content frame-content" role="main">
        {% set framed = true %}
        {% include "includes/message-header.html" %}
        {% include "includes/message-content.html" %}
      </div>
    </div>
  </div>
  <script>
    document.getElementById('hdr-toggle')?.addEventListener('click', function (e) {
      e.preventDefault();
      var el = document.querySelector('.header-headers');
      if (!el) return;
      var show = el.classList.toggle('show');
      this.textContent = show ? 'Summary' : 'Details';
      if (window.parent && window.parent.cc_set_summary_label)
        window.parent.cc_set_summary_label(this.textContent);
    });
  </script>
</body>
</html>
