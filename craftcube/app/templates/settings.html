{% include "includes/layout.html" %}
{% include "includes/menu.html" %}

    <h1 class="voice">Settings</h1>

    <div id="layout-sidebar" class="listbox" role="navigation">
      <div class="header">
        <a class="button icon back-list-button" href="#back"><span class="inner">Back</span></a>
        <span class="header-title username">{{ current_user.username }}</span>
      </div>
      <div class="scroller">
        <ul class="listing settings-table treelist">
          <li class="selected"><a href="{{ url_for('views.settings') }}">User settings</a></li>
          <li><a href="{{ url_for('views.identities') }}">Identities</a></li>
          <li><a href="{{ url_for('views.folders_view') }}">Folders</a></li>
        </ul>
      </div>
    </div>

    <div id="layout-content" class="selected">
      <div class="header"><span class="header-title">User settings</span></div>
      <div class="formcontainer content">
        <ul class="proplist settings-table listing">
          <li><a href="#password" class="collapsed" id="pwd-toggle">Change password</a></li>
        </ul>
        <fieldset id="password-fieldset" style="display:none">
          <legend>Change password</legend>
          <form method="post" action="{{ url_for('views.settings_password') }}" class="propform">
            <table class="layout">
              <tbody>
                <tr><td class="title"><label for="currentpass">Current password</label></td>
                    <td><input type="password" name="_current" id="currentpass" class="form-control" autocomplete="current-password"></td></tr>
                <tr><td class="title"><label for="newpass">New password</label></td>
                    <td><input type="password" name="_new" id="newpass" class="form-control" autocomplete="new-password"></td></tr>
                <tr><td class="title"><label for="confpass">Confirm password</label></td>
                    <td><input type="password" name="_confirm" id="confpass" class="form-control" autocomplete="new-password"></td></tr>
              </tbody>
            </table>
            <div class="formbuttons">
              <button type="submit" class="btn btn-primary icon save">Save</button>
            </div>
          </form>
        </fieldset>
      </div>
    </div>

{% include "includes/footer.html" %}
<script>
  document.getElementById('pwd-toggle').addEventListener('click', function (e) {
    e.preventDefault();
    var f = document.getElementById('password-fieldset');
    f.style.display = f.style.display === 'none' ? 'block' : 'none';
  });
</script>
