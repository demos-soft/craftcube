# CraftCube development IMAP/LMTP server (no TLS — local network only)
protocols = imap lmtp
listen = *

# dev: plaintext on 143, no TLS
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

log_path = /dev/stderr
info_log_path = /dev/stderr

mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000

mail_location = maildir:/var/mail/test/Maildir

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = create
  }
  mailbox Sent {
    special_use = \Sent
    auto = create
  }
  mailbox Trash {
    special_use = \Trash
    auto = create
  }
  mailbox Junk {
    special_use = \Junk
    auto = create
  }
  mailbox Archive {
    special_use = \Archive
    auto = create
  }
}

passdb {
  driver = passwd-file
  args = /etc/dovecot/users
}

userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/test allow_all_users=yes
}

service lmtp {
  inet_listener lmtp {
    address = 0.0.0.0
    port = 24
  }
}

protocol imap {
  mail_max_userip_connections = 50
}
