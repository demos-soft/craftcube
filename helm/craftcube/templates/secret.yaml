{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "craftcube.fullname" . }}-secrets
  labels:
    {{- include "craftcube.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Flask session signing key (CRAFTCUBE_SECRET)
  flask-secret: {{ required "secret.flaskSecret is required (or set secret.existingSecret) - e.g. `openssl rand -hex 32`" .Values.secret.flaskSecret | quote }}
  {{- if .Values.secret.imapAdminUser }}
  imap-admin-user: {{ .Values.secret.imapAdminUser | quote }}
  imap-admin-pass: {{ .Values.secret.imapAdminPass | quote }}
  {{- end }}
{{- end }}
