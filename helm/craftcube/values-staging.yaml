# Staging deployment on k8s3.lan (microk8s, single node).
# helm upgrade --install craftcube ./helm/craftcube -f helm/craftcube/values-staging.yaml -n craftcube --create-namespace
#
# Mail topology (mirrors docker/docker-compose.yml): mailpit takes SMTP +
# web UI and relays everything into the dovecot component (IMAP + Maildir).
#
# NodePorts (quintone owns 30080/30025/30362, stay clear):
#   craftcube      http://k8s3.lan:30090
#   roundcube ref  http://k8s3.lan:30091  (staging/k8s3/roundcube-reference.yaml)
#   mailpit UI     http://k8s3.lan:30092

image:
  repository: registry.k8s3.lan:5000/craftcube
  tag: stage
  pullPolicy: Always
  pullSecrets: []

service:
  type: NodePort
  nodePort: 30090

mailpit:
  enabled: true
  imagePullPolicy: Always
  relay:
    enabled: true
    host: craftcube-dovecot
    port: 2525
  persistence:
    size: 2Gi
    storageClassName: microk8s-hostpath
  service:
    type: NodePort
    uiNodePort: 30092

dovecot:
  enabled: true
  image:
    repository: registry.k8s3.lan:5000/craftcube-dovecot
    tag: stage
    pullPolicy: Always
  persistence:
    size: 2Gi
    storageClassName: microk8s-hostpath
  # imapNodePort: 30093   # uncomment to debug IMAP from outside

config:
  imap:
    host: craftcube-dovecot
    port: 143
  smtp:
    host: craftcube-mailpit
    port: 1025

secret:
  create: true
  flaskSecret: "staging-only-secret-4f3d2c1b9a08"

persistence:
  enabled: true
  size: 1Gi
  storageClassName: "microk8s-hostpath"

# OOM history at the 512Mi default (4 restarts on 2026-11-04); gunicorn runs
# 2 sync-IMAP workers, 1Gi keeps liveness probes from starving.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Live-only overrides promoted into the chart so helm upgrade cannot revert
# them (plugins wiped on every upgrade before 2026-11-04).
extraEnv:
  - name: CRAFTCUBE_PLUGINS
    value: zipdownload,additional_message_headers
  - name: CRAFTCUBE_DB
    value: /data/craftcube.sqlite
