# Default values for the craftcube chart.

image:
  repository: craftcube
  # defaults to .Chart.AppVersion when empty
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 1

# HTTP port the container listens on (gunicorn).
containerPort: 8000

service:
  type: ClusterIP
  port: 80
  # nodePort: 30080   # only used when type is NodePort

# Mailpit SMTP front-end + web UI (SMTP :1025, UI :8025) for staging/demo.
# OSS mailpit has NO IMAP server (that is Mailpit Pro); pair it with the
# `dovecot` component below (mailpit relays all mail into dovecot, webmail
# clients read via IMAP) — same topology as docker/docker-compose.yml.
mailpit:
  enabled: false
  image: docker.io/axllent/mailpit:latest
  imagePullPolicy: IfNotPresent
  maxMessages: 5000
  relay:
    # relay every accepted message to an IMAP-capable store (dovecot)
    enabled: false
    host: ""
    port: 2525
  persistence:
    size: 1Gi
    storageClassName: ""
  service:
    type: ClusterIP
    smtpNodePort: null
    uiNodePort: null
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# Development-style dovecot (IMAP :143 + a stdlib SMTP receiver :2525 that
# appends to a Maildir; special folders auto-created; passwd-file logins).
# The image is custom — build it from docker/imap/ (see README/staging docs).
dovecot:
  enabled: false
  image:
    repository: ""
    tag: stage
    pullPolicy: IfNotPresent
    pullSecrets: []
  persistence:
    size: 2Gi
    storageClassName: ""
  service:
    type: ClusterIP
    imapNodePort: null
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: craftcube.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# All app configuration is environment-driven (see README.md).
config:
  # IMAP/SMTP servers CraftCube talks to
  imap:
    host: imap.example.org
    port: 143
    ssl: false
  smtp:
    host: smtp.example.org
    port: 587
    ssl: false
  # special mail folders; Dovecot \SpecialUse flags are auto-detected first
  draftsFolder: Drafts
  sentFolder: Sent
  trashFolder: Trash
  productName: CraftCube
  # "1": authenticate IMAP with each user's own password (Roundcube default).
  # "0": shared-mailbox mode using the admin credentials from `secret`.
  perUserPasswords: "1"
  pageSize: 50

# Credentials managed as a Kubernetes Secret.
secret:
  # Existing secret to consume instead of creating one (keys below must exist).
  existingSecret: ""
  create: true
  # Flask session signing key — SET THIS IN YOUR VALUES, e.g. `openssl rand -hex 32`
  flaskSecret: ""
  # Shared admin mailbox credentials (only used with config.perUserPasswords=0)
  imapAdminUser: ""
  imapAdminPass: ""

persistence:
  enabled: true
  size: 1Gi
  accessModes:
    - ReadWriteOnce
  # empty = default StorageClass
  storageClassName: ""
  mountPath: /data
  # when disabled, SQLite lives on emptyDir (data is lost on reschedule)
  ephemeral: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# SQLite is single-writer; keep 1 unless the DB is on an RWX volume.
strategy:
  type: Recreate

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: false
securityContext: {}

probes:
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
